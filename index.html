<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BeLive AutoPost — Indoor Tenant Sales Listing</title>
<meta name="description" content="Internal console for BeLive indoor tenant sales listings: one room record, channel-shaped copy for iBilik, Mudah, Facebook and PropertyGuru, and a bump clock that says what to renew today." />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<a class="skip" href="#view">Skip to content</a>

<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true">BL</span>
      <span class="brand__text">AutoPost<small>Indoor tenant sales listing</small></span>
    </a>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="topbar__tools">
      <span class="vault-pill vault-pill--shut" id="vault-indicator">Vault not set up</span>
      <button class="icon-btn" id="palette-trigger" title="Jump to (Ctrl+K)" aria-label="Jump to">⌘K</button>
      <button class="icon-btn" id="theme-toggle" title="Switch theme" aria-label="Switch theme">◐</button>
    </div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <footer class="footer">
    <p>Runs entirely in this browser — no server, no listing data leaves the device. Credentials live in the encrypted vault on the <a href="#/accounts">Accounts</a> page.</p>
    <p class="footer__keys"><kbd>Ctrl</kbd>+<kbd>K</kbd> jump · <kbd>N</kbd> new listing · <kbd>Q</kbd> work queue · <kbd>L</kbd> listings · <kbd>D</kbd> control tower</p>
  </footer>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>

<dialog id="modal" class="modal" aria-labelledby="modal-title">
  <div class="modal__inner">
    <header class="modal__head">
      <h2 id="modal-title" class="modal__title">Dialog</h2>
      <button class="modal__close" aria-label="Close">×</button>
    </header>
    <div id="modal-body" class="modal__body"></div>
  </div>
</dialog>

<noscript>
  <p style="padding:2rem;font:16px system-ui">This console is a JavaScript application. Enable JavaScript to use it.</p>
</noscript>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
